<!-- Service worker (Tier 1: network-first HTML so a deploy is never served stale; https only, so local
     previews are unaffected). controllerchange reloads once to swap a new deploy in. -->
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }
</script>
